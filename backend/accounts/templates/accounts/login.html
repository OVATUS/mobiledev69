{% extends "accounts/base.html" %}
{% block title %}เข้าสู่ระบบ{% endblock %}
{% block heading %}เข้าสู่ระบบ{% endblock %}
{% block content %}
  {% if form.errors %}
    <p class="alert">ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง</p>
  {% endif %}
  <form method="post">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next }}">
    <label for="id_username">ชื่อผู้ใช้</label>
    <input type="text" name="username" id="id_username" value="{{ form.username.value|default:'' }}" autofocus required>
    <label for="id_password">รหัสผ่าน</label>
    <input type="password" name="password" id="id_password" required>
    <button type="submit" class="btn">เข้าสู่ระบบ</button>
  </form>
  <p class="switch">ยังไม่มีบัญชี?
    <a href="{% url 'register' %}?next={{ next|urlencode }}">สมัครสมาชิก</a>
  </p>
{% endblock %}
